services:
  api:
    build: .
    container_name: energy-optimization-api
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:8501}
      # Required: comma-separated API keys clients send in the X-API-Key header (see .env.example)
      - API_KEYS=${API_KEYS:?Set API_KEYS in .env (see .env.example)}
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-60}
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    command: ["python", "-m", "uvicorn", "src.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  dashboard:
    build: .
    container_name: energy-optimization-dashboard
    # The dashboard has no login: it is bound to localhost only. Put it behind an
    # authenticating reverse proxy before exposing it to other machines.
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    command: ["streamlit", "run", "src/visualization/dashboard.py", "--server.port=8501", "--server.address=0.0.0.0"]
    restart: unless-stopped
    depends_on:
      - api

  # Optional: MLflow tracking server
  mlflow:
    image: python:3.10-slim-bookworm
    container_name: energy-optimization-mlflow
    # MLflow has no authentication either, so it is bound to localhost only
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./mlruns:/mlruns
      - ./mlflow-artifacts:/mlflow-artifacts
    environment:
      - MLFLOW_BACKEND_STORE_URI=file:///mlruns
      - MLFLOW_DEFAULT_ARTIFACT_ROOT=file:///mlflow-artifacts
    command: >
      bash -c "pip install mlflow==2.7.1 && 
               mlflow server --backend-store-uri file:///mlruns 
                           --default-artifact-root file:///mlflow-artifacts 
                           --host 0.0.0.0"
    restart: unless-stopped